spring.application.name=card-agent
#spring.ai.mcp.client.enabled=true
#pring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
#spring.ai.anthropic.headers.anthropic-workspace-id=${anthropic-workspace-id}
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.embedding.options.dimensions=384
spring.ai.openai.embedding.options.model=text-embedding-3-small
spring.ai.mcp.client.streamable-http.connections.card-service.url=http://localhost:8090/card-agent-mcp-server

spring.docker.compose.stop.command=down

spring.ai.vectorstore.qdrant.initialize-schema=true
spring.ai.vectorstore.qdrant.host=localhost
spring.ai.vectorstore.qdrant.port=6334
spring.ai.vectorstore.qdrant.collection-name=card_products

# ----------------------------------------------------------------------
# Outbound mail (SMTP) - used only to SEED the fake inbox with test emails.
# Points at the Mailpit container from compose.yaml.
# ----------------------------------------------------------------------
spring.mail.host=localhost
logging.level.org.springframework.ai.chat.client.advisor=INFO
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ----------------------------------------------------------------------
# Inbox monitoring (Mailpit REST API) - what the agent watches.
# ----------------------------------------------------------------------
card-agent.inbox.base-url=http://localhost:8025
# Address the agent's mailbox uses (recipient when seeding test mail).
card-agent.inbox.address=card-support@mybank.com
card-agent.inbox.closure-team=card-closure-support@mybank.com
# How often to poll the inbox, in milliseconds.
card-agent.inbox.poll-interval=15000
# Max unread messages pulled per poll.
card-agent.inbox.batch-size=50